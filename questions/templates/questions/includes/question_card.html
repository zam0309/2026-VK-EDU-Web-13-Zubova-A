{% load static %}
<div class="card mb-3">
    <div class="card-body d-flex gap-3">
        <div>
            <img src="{% static 'core/img/avatar.svg' %}" class="avatar" alt="avatar">
            {% include 'core/includes/vote.html' with rating=question.rating %}
        </div>
        <div class="flex-grow-1">
            <h5 class="card-title"><a href="{% url 'question' question.id %}">{{ question.title }}</a></h5>
            <p class="card-text">{{ question.text }}</p>
            <div class="d-flex flex-wrap gap-3 small">
                <a href="{% url 'question' question.id %}">answer ({{ question.answers_count }})</a>
                {% include 'questions/includes/tags.html' with tags=question.tags %}
            </div>
        </div>
    </div>
</div>

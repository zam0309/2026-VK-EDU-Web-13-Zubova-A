<div class="card mb-3">
    <div class="card-body d-flex gap-3">
        <div>
            {% include 'core/includes/avatar.html' with author=question.author %}
            {% include 'core/includes/vote.html' with rating=question.rating %}
        </div>
        <div class="flex-grow-1">
            <h5 class="card-title"><a href="{{ question.get_absolute_url }}">{{ question.title }}</a></h5>
            <p class="card-text">{{ question.text }}</p>
            <div class="d-flex flex-wrap gap-3 small">
                <a href="{{ question.get_absolute_url }}">answer ({{ question.answers_count }})</a>
                {% include 'questions/includes/tags.html' with tags=question.tags.all %}
            </div>
        </div>
    </div>
</div>

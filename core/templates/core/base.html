{% load static %}<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AskPupkin{% endblock %} | AskPupkin</title>
    <link rel="icon" href="{% static 'core/img/icon.svg' %}" type="image/svg+xml">
    <link rel="icon" href="{% static 'core/img/icon.ico' %}" sizes="any">
    <link rel="stylesheet" href="{% static 'core/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'core/css/style.css' %}">
</head>
<body class="d-flex flex-column min-vh-100">
    {% include 'core/includes/header.html' %}

    <main class="container flex-grow-1 py-4">
        <div class="row g-4">
            <div class="col-md-8">
                {% block content %}{% endblock %}
            </div>
            <div class="col-md-4">
                {% include 'core/includes/sidebar.html' %}
            </div>
        </div>
    </main>

    <footer class="border-top py-3">
        <div class="container">AskPupkin, 2026</div>
    </footer>

    <script src="{% static 'core/js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>

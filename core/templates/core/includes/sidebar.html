<h3>Popular Tags</h3>
<p class="tags">
    {% for tag in popular_tags %}
        <a href="{{ tag.get_absolute_url }}" class="{% cycle 'text-danger fs-5' 'text-dark' 'text-success fs-5' 'text-dark' 'text-danger' %}">{{ tag.name }}</a>
    {% empty %}
        Тегов пока нет.
    {% endfor %}
</p>

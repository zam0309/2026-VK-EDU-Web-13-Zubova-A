{% load static %}
<header class="border-bottom">
    <div class="container py-3 d-flex flex-wrap align-items-center gap-3">
        <a href="{% url 'index' %}" class="logo">AskPupkin</a>
        <form class="header-search" role="search">
            <input type="search" name="q" class="form-control" placeholder="Поиск">
        </form>
        {% if user.is_authenticated %}
            <a href="{% url 'ask' %}" class="btn btn-success">ASK!</a>
        {% else %}
            <span title="Войдите, чтобы задать вопрос">
                <button class="btn btn-success opacity-100" type="button" disabled>ASK!</button>
            </span>
        {% endif %}
        {% if user.is_authenticated %}
            <div class="d-flex align-items-center gap-2 ms-auto">
                {% if user.profile.avatar %}
                    <img src="{{ user.profile.avatar.url }}" class="avatar-small" alt="avatar">
                {% else %}
                    <img src="{% static 'core/img/avatar.svg' %}" class="avatar-small" alt="avatar">
                {% endif %}
                <div>
                    <div>{{ user.first_name|default:user.username }}</div>
                    <a href="{% url 'profile' %}">settings</a>
                    <form method="post" action="{% url 'logout' %}" class="d-inline ms-2">
                        {% csrf_token %}
                        <input type="hidden" name="next" value="{{ request.get_full_path }}">
                        <button type="submit" class="btn btn-link p-0 border-0 align-baseline">log out</button>
                    </form>
                </div>
            </div>
        {% else %}
            <div class="ms-auto">
                <a href="{% url 'login' %}">log in</a>
                <a href="{% url 'signup' %}" class="ms-2">register</a>
            </div>
        {% endif %}
    </div>
</header>
